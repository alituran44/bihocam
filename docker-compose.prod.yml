version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    container_name: bihocam_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - bihocam_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bihocam_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    networks:
      - bihocam_net
    expose:
      - "3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bihocam_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips="*"
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./bihocam.db
      - SECRET_KEY=bihocam-super-secure-production-secret-key-32chars
      - CORS_ORIGINS=["http://13.53.172.136", "http://ec2-13-53-172-136.eu-north-1.compute.amazonaws.com", "https://bihocam.com", "https://www.bihocam.com", "http://localhost:3000"]
    volumes:
      - ./backend/bihocam.db:/app/bihocam.db
      - ./backend/media:/app/media
    networks:
      - bihocam_net
    expose:
      - "8000"

volumes:
  caddy_data:
  caddy_config:

networks:
  bihocam_net:
    driver: bridge
